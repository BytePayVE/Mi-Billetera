name: Compilar Pagobyte (Android APK + iPhone Web)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Pagobyte.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_all:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Preparar carpeta temporal de compilación
        run: |
          mkdir -p _build_tmp
          cp Pagobyte.zip _build_tmp/

      - name: Generar estructura Android y Web
        working-directory: _build_tmp
        run: flutter create . --platforms=android,web --org com.pagobyte.app --project-name pagobyte

      - name: Descomprimir Pagobyte.zip
        working-directory: _build_tmp
        run: unzip -o Pagobyte.zip

      - name: Configurar nombre Pagobyte, permisos, Biometría, Desugaring y Lint
        working-directory: _build_tmp
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Pagobyte"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          find android/app/src/main/kotlin -name "MainActivity.kt" -exec sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' {} +
          find android/app/src/main/kotlin -name "MainActivity.kt" -exec sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' {} +
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '0,/android {/s/android {/android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts
            sed -i '0,/compileOptions {/s/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '0,/android {/s/android {/android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' android/app/build.gradle
            sed -i '0,/compileOptions {/s/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' android/app/build.gradle
            printf "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n" >> android/app/build.gradle
          fi

      - name: Instalar dependencias y generar ícono
        working-directory: _build_tmp
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Compilar APK Release optimizado (liviano)
        working-directory: _build_tmp
        run: flutter build apk --release --split-per-abi --tree-shake-icons

      - name: Compilar versión Web / iPhone PWA (con ruta /Mi-Billetera/app/)
        working-directory: _build_tmp
        run: flutter build web --release --base-href "/Mi-Billetera/app/"

      - name: Publicar carpeta app/ completa y pagobyte.apk en el repositorio
        run: |
          rm -rf app
          mkdir -p app
          cp -r _build_tmp/build/web/* app/
          cp _build_tmp/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk pagobyte.apk
          rm -rf _build_tmp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app pagobyte.apk
          git diff --cached --quiet || git commit -m "Publicar app iPhone completa y APK [skip ci]"
          git push

      - name: Subir APK Android como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pagobyte-android-apk
          path: pagobyte.apk
