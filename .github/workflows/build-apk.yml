name: Compilar Pagobyte (Android APK + iPhone Web)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Pagobyte.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_all:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Preparar carpeta temporal de compilación
        run: |
          mkdir -p _build_tmp
          cp Pagobyte.zip _build_tmp/

      - name: Generar estructura Android y Web
        working-directory: _build_tmp
        run: flutter create . --platforms=android,web --org com.pagobyte.app --project-name pagobyte

      - name: Descomprimir Pagobyte.zip
        working-directory: _build_tmp
        run: unzip -o Pagobyte.zip

      - name: Configurar nombre Pagobyte, permisos, Biometría, Desugaring y Lint
        working-directory: _build_tmp
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Pagobyte"/' android/app/src/main/AndroidManifest.xml
          sed -i
