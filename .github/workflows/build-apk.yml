name: Compilar Pagobyte (Android APK + iPhone Web)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Pagobyte.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_all:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Preparar carpeta temporal
        run: |
          mkdir -p _build_tmp
          cp Pagobyte.zip _build_tmp/

      - name: Generar estructura Android y Web
        working-directory: _build_tmp
        run: flutter create . --platforms=android,web --org com.pagobyte.app --project-name pagobyte

      - name: Descomprimir Pagobyte.zip
        working-directory: _build_tmp
        run: unzip -o Pagobyte.zip

      - name: Configurar Android (Nombre, Permisos, Biometria y Desugaring)
        working-directory: _build_tmp
        run: |
          python3 - << 'EOF'
          import os, re, glob

          # 1. AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              txt = f.read()
          txt = re.sub(r'android:label="[^"]*"', 'android:label="Pagobyte"', txt)
          perms = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <application"""
          if "USE_BIOMETRIC" not in txt:
              txt = txt.replace("<application", perms, 1)
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(txt)

          # 2. MainActivity.kt (FlutterFragmentActivity para biometria)
          for kt in glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True):
              with open(kt, "r", encoding="utf-8") as f:
                  ktxt = f.read()
              ktxt = ktxt.replace("FlutterActivity", "FlutterFragmentActivity")
              with open(kt, "w", encoding="utf-8") as f:
                  f.write(ktxt)

          # 3. build.gradle.kts o build.gradle
          if os.path.exists("android/app/build.gradle.kts"):
              gp = "android/app/build.gradle.kts"
              with open(gp, "r", encoding="utf-8") as f:
                  gtxt = f.read()
              if "checkReleaseBuilds" not in gtxt:
                  gtxt = gtxt.replace("android {", "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }", 1)
              if "isCoreLibraryDesugaringEnabled" not in gtxt:
                  gtxt = gtxt.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              if "desugar_jdk_libs" not in gtxt:
                  gtxt += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              with open(gp, "w", encoding="utf-8") as f:
                  f.write(gtxt)
          elif os.path.exists("android/app/build.gradle"):
              gp = "android/app/build.gradle"
              with open(gp, "r", encoding="utf-8") as f:
                  gtxt = f.read()
              if "checkReleaseBuilds" not in gtxt:
                  gtxt = gtxt.replace("android {", "android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }", 1)
              if "coreLibraryDesugaringEnabled" not in gtxt:
                  gtxt = gtxt.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
              if "desugar_jdk_libs" not in gtxt:
                  gtxt += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              with open(gp, "w", encoding="utf-8") as f:
                  f.write(gtxt)
          print("Configuracion Android completada.")
          EOF

      - name: Instalar dependencias y generar icono
        working-directory: _build_tmp
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Compilar APK Release optimizado
        working-directory: _build_tmp
        run: flutter build apk --release --split-per-abi --tree-shake-icons

      - name: Compilar version Web / iPhone PWA
        working-directory: _build_tmp
        run: flutter build web --release --base-href "/Mi-Billetera/app/" --no-tree-shake-icons

      - name: Publicar carpeta app/ completa y pagobyte.apk
        run: |
          rm -rf app
          mkdir -p app
          cp -r _build_tmp/build/web/* app/
          cp _build_tmp/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk pagobyte.apk
          rm -rf _build_tmp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app pagobyte.apk
          git diff --cached --quiet || git commit -m "Publicar app iPhone completa y APK"
          git push

      - name: Subir APK Android como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pagobyte-android-apk
          path: pagobyte.apk
