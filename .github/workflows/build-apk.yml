name: Compilar APK Pagobyte

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar estructura Android
        run: flutter create . --platforms=android --org com.pagobyte.app --project-name pagobyte_clientes

      - name: Descomprimir proyecto Pagobyte y corregir null-safety
        run: |
          unzip -o pagobyte-app-clientes-flutter_2.zip
          sed -i 's/_openReportPaymentSheet(siguiente, rec, estado);/_openReportPaymentSheet(siguiente!, rec, estado);/' lib/screens/cuotas_tab.dart

      - name: Configurar permisos y desactivar Android Lint
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '0,/android {/s/android {/android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '0,/android {/s/android {/android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' android/app/build.gradle
          fi

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: pagobyte-clientes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
